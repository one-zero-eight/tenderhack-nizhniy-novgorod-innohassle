{# Общий каркас страницы поддержки: сайдбар с чатами + панель.
   Ждёт: chat, chats, active_id, base (префикс роутов), new_chat_title. #}
<div class="support-layout">
  <aside class="sidebar">
    <div class="sidebar-head">Чаты</div>
    <button
      type="button"
      class="btn-primary new-chat"
      hx-post="{{ base }}/chats"
      hx-target="body"
      hx-swap="outerHTML"
    >{{ new_chat_title | default("Новый чат") }}</button>
    {% include "chat_list.html" %}
  </aside>
  <div id="chat-panel">
    {% include "chat_panel.html" %}
  </div>
</div>
