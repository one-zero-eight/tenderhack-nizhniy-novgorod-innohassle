{#
  Поддерево мануала: кнопка раздела + его текст + лениво подгружаемые дети.
  Ответ на GET /knowledge-base/<slug>/sections/<id>. Дети грузятся при раскрытии.
#}
<div class="tree-node" id="section-{{ section.id }}">
  <button
    type="button"
    class="tree-toggle{% if not section.has_children %} leaf{% endif %}"
    {% if section.has_children %}
      hx-get="/knowledge-base/{{ manual.slug }}/sections/{{ section.id }}"
      hx-target="#subtree-{{ section.id }}"
      hx-swap="innerHTML"
    {% endif %}
    onclick="this.classList.toggle('open');this.parentElement.querySelector('.tree-kids')?.classList.toggle('open')"
  >
    <span class="tree-caret" aria-hidden="true"></span>
    <span class="tree-label">{{ section.title_line }}</span>
  </button>

  <div class="tree-kids" id="subtree-{{ section.id }}">
    <div class="section-card">
      <div class="section-body markdown">{{ section.body | safe }}</div>
    </div>
    {% if section.children %}
      <ul class="tree">
        {% for child_id in section.children %}
          <li>
            <div class="tree-node" id="section-{{ child_id }}">
              <button
                type="button"
                class="tree-toggle"
                hx-get="/knowledge-base/{{ manual.slug }}/sections/{{ child_id }}"
                hx-target="#subtree-{{ child_id }}"
                hx-swap="innerHTML"
                onclick="this.classList.toggle('open');this.parentElement.querySelector('.tree-kids')?.classList.toggle('open')"
              >
                <span class="tree-caret" aria-hidden="true"></span>
                <span class="tree-label">{{ manual.sections[child_id].title_line }}</span>
              </button>
              <div class="tree-kids" id="subtree-{{ child_id }}"></div>
            </div>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</div>
