services:
  api:
    build: &backend-build
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        # Wait for the database to be ready before starting the application
        condition: service_healthy
    restart: always
    ports:
      - "8000:8001"
    environment:
      # Settings can be fully configured via environment variables, no settings.yaml needed.
      API_SETTINGS__DB_URL: ${API_SETTINGS__DB_URL:-postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres}
      API_SETTINGS__APP_ROOT_PATH: ${API_SETTINGS__APP_ROOT_PATH:-}
      API_SETTINGS__CORS_ALLOW_ORIGIN_REGEX: ${API_SETTINGS__CORS_ALLOW_ORIGIN_REGEX:-.*}
      API_SETTINGS__JWT_SECRET: ${API_SETTINGS__JWT_SECRET:-}
      API_SETTINGS__ACCESS_TOKEN_MINUTES: ${API_SETTINGS__ACCESS_TOKEN_MINUTES:-120}
      API_SETTINGS__AI_BASE_URL: ${API_SETTINGS__AI_BASE_URL:-http://ai-stub:8002}
      API_SETTINGS__AI_SERVICE_TOKEN: ${API_SETTINGS__AI_SERVICE_TOKEN:-}
      API_SETTINGS__MODERATION_MODEL_PATH: ${API_SETTINGS__MODERATION_MODEL_PATH:-/app/models/rubert-tiny-toxicity}
      API_SETTINGS__MODERATION_THRESHOLD: ${API_SETTINGS__MODERATION_THRESHOLD:-0.8}
      API_SETTINGS__MODERATION_BLOCK_LABELS: ${API_SETTINGS__MODERATION_BLOCK_LABELS:-["obscenity","insult"]}
      API_SETTINGS__MODERATION_TIMEOUT: ${API_SETTINGS__MODERATION_TIMEOUT:-5}
      API_SETTINGS__AI_ANSWER_TIMEOUT: ${API_SETTINGS__AI_ANSWER_TIMEOUT:-30}
      API_SETTINGS__AI_ROUTING_TIMEOUT: ${API_SETTINGS__AI_ROUTING_TIMEOUT:-5}
    # Optional: mount settings.yaml to override values. Commented out so it is not required.
    # volumes:
    #   - "./settings.yaml:/app/settings.yaml:ro"

  # Development contract stub only; normal deployments supply API_SETTINGS__AI_BASE_URL.
  ai-stub:
    profiles: ["demo"]
    build: *backend-build
    command: ["uv", "run", "--no-sync", "uvicorn", "scripts.ai_stub:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      API_SETTINGS__AI_SERVICE_TOKEN: ${API_SETTINGS__AI_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:8002:8002"

  db:
    # See more: https://hub.docker.com/_/postgres
    image: "postgres:17.1"
    restart: always
    volumes:
      - "postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

volumes:
  postgres:
