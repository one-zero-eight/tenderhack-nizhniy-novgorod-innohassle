[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "colorlog>=6.9.0",
    "fastapi>=0.116.1",
    "fastapi-derive-responses>=0.1.4",
    "fastapi-swagger>=0.3.29",
    "gunicorn>=23.0.0",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "libcst>=1.8.4",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "ruff>=0.12.11",
    "sqlalchemy>=2.0.43",
    "torch>=2.6,<3",
    "transformers>=4.55,<5",
    "huggingface-hub>=0.34,<1",
    "typer>=0.17.4",
    "uvicorn>=0.35.0",
]

[tool.ruff]
line-length = 120
lint.ignore = [
    # wildcard imports are fine
    "F403",
    "F405",
    "PLR"
]
lint.extend-select = ["I", "UP", "PL"]
exclude = [
    ".git",
    ".venv",
    "venv",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

# CPU inference does not require CUDA wheels in the backend image.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
