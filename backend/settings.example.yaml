# yaml-language-server: $schema=settings.schema.yaml
#
# This file is OPTIONAL. Every value below can be provided via environment variables
# instead, using the `API_SETTINGS__<FIELD_NAME>` convention, e.g.:
#
#   API_SETTINGS__DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
#   API_SETTINGS__APP_ROOT_PATH=/api
#   API_SETTINGS__CORS_ALLOW_ORIGIN_REGEX=".*"
#
# Priority (highest first): environment variables > this file > model defaults.
$schema: "./settings.schema.yaml"
api_settings:
  db_url: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres"
  # Generate with: uv run python -c 'import secrets; print(secrets.token_hex(32))'
  jwt_secret: ""
  access_token_minutes: 120
  # Empty for direct access to the API; set /api only behind a proxy that strips it.
  app_root_path: ""
  ai_base_url: "http://127.0.0.1:8002"
  ai_service_token: null
  moderation_model_path: "models/rubert-tiny-toxicity"
  moderation_threshold: 0.8
  moderation_block_labels: [obscenity, insult]
  moderation_timeout: 5
  ai_answer_timeout: 30
  ai_routing_timeout: 5
