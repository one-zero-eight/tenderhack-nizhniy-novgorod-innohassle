services:
  caddy:
    image: caddy:2.9-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network
    depends_on:
      - frontend
      - api

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      API_SETTINGS__DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
      API_SETTINGS__APP_ROOT_PATH: "/api"
      API_SETTINGS__CORS_ALLOW_ORIGIN_REGEX: ".*"
      API_SETTINGS__JWT_SECRET: "12345678901234567890123456789012"
      API_SETTINGS__AI_BASE_URL: ${API_SETTINGS__AI_BASE_URL:-http://100.64.0.5:8010}
      API_SETTINGS__AI_SERVICE_TOKEN: ${API_SETTINGS__AI_SERVICE_TOKEN:-}
      API_SETTINGS__MODERATION_MODEL_PATH: ${API_SETTINGS__MODERATION_MODEL_PATH:-/app/models/rubert-tiny-toxicity}
      API_SETTINGS__MODERATION_THRESHOLD: ${API_SETTINGS__MODERATION_THRESHOLD:-0.8}
      API_SETTINGS__MODERATION_BLOCK_LABELS: ${API_SETTINGS__MODERATION_BLOCK_LABELS:-["obscenity","insult"]}
      API_SETTINGS__MODERATION_TIMEOUT: ${API_SETTINGS__MODERATION_TIMEOUT:-5}
      API_SETTINGS__AI_ANSWER_TIMEOUT: ${API_SETTINGS__AI_ANSWER_TIMEOUT:-30}
      API_SETTINGS__AI_ROUTING_TIMEOUT: ${API_SETTINGS__AI_ROUTING_TIMEOUT:-5}

    networks:
      - app_network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
    networks:
      - app_network

  db:
    image: "postgres:17.1"
    restart: always
    # The commits were slow on our servers, so we turned off the synchronous_commit
    command: postgres -c synchronous_commit=off
    volumes:
      - "postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks:
      - app_network

volumes:
  postgres:
  caddy_data:
  caddy_config:

networks:
  app_network:
